services:
  - type: web
    name: lycan-internship-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate
    startCommand: npm run prisma:migrate:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MATCHING_PROVIDER
        value: local
      - key: EXPLANATION_PROVIDER
        value: local
